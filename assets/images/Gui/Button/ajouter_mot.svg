<svg width="150" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond du bouton -->
  <rect x="5" y="5" width="140" height="70" rx="12" ry="12"
        fill="url(#buttonGradient)"
        stroke="#8B4513"
        stroke-width="4"
        filter="url(#shadow)"/>

  <!-- Bordure interieure -->
  <rect x="10" y="10" width="130" height="60" rx="8" ry="8"
        fill="none"
        stroke="#FFEC8B"
        stroke-width="2"/>

  <!-- Texte AJOUTER -->
  <text x="75" y="38"
        font-family="Arial Black, Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#8B0000"
        text-anchor="middle">AJOUTER</text>

  <!-- Texte MOT -->
  <text x="75" y="58"
        font-family="Arial Black, Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#8B0000"
        text-anchor="middle">MOT</text>
</svg>
